    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",

  <body>
    <div id="root"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
   <script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  function renderButton() {
    const btn = document.getElementById('google-login-button');
    if (btn && window.google) {
      google.accounts.id.initialize({
        client_id: "923314753991-mb33b5p8q6rr7l4t28oark2ddf08obuc.apps.googleusercontent.com",
        callback: (response) => {
          // Dit koppelt aan je login logica
          console.log("Google login succesful");
          window.dispatchEvent(new CustomEvent('google-auth-success', { detail: response }));
        }
      });
      google.accounts.id.renderButton(btn, { theme: 'outline', size: 'large' });
    } else {
      setTimeout(renderButton, 200); // Probeer opnieuw als de div nog niet geladen is
    }
  }
  window.onload = renderButton;
</script>
  </body>
</html>
